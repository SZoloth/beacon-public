name: BeaconPhone
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    # Swift 5 mode, like the Mac package: LinkPresentation types aren't Sendable yet.
    SWIFT_VERSION: "5.0"

targets:
  BeaconPhone:
    type: application
    platform: iOS
    sources:
      - Sources
      # Settings › Beacon: where the phone's access key is pasted.
      - path: Settings.bundle
        buildPhase: resources
      # The Mac app's screens and data code; the two Mac-only files run beacon.py directly.
      - path: ../Sources/BeaconTriage
        excludes:
          - BeaconTriageApp.swift
          - BeaconCLI.swift
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Beacon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # beacon serve is plain HTTP inside the tailnet (Tailscale encrypts the link).
        NSAppTransportSecurity:
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.beacon-phone
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
